    <!-- Tailwind CSS CDN -->

    <!-- Google Fonts: Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        bgDark: '#060318',
                        cardDark: '#0b0629',
                        borderIndigo: '#1e1654',
                        accentLilac: '#8b9cff',
                        accentAmber: '#f5b013',
                    }
                }
            }
        }

    <style>
        body {
            background-color: #060318;
            background-image: 
                radial-gradient(circle at 80% 10%, rgba(45, 25, 110, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 15% 70%, rgba(35, 20, 95, 0.3) 0%, transparent 45%);
            color: #f8fafc;
        }
        .text-gradient-amber {
            background: linear-gradient(90deg, #8b9cff 0%, #f5b013 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .code-window {
            background: #0d0732;
            border: 1px solid #281d69;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        .code-window::before {
            content: '';
            position: absolute;
            top: -1px;
            right: 20px;
            left: 20px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #8b9cff, #f5b013, transparent);
        }
        .skill-card {
            background: #0a0524;
            border: 1px solid #1e1654;
            transition: all 0.3s ease;
        }
        .skill-card:hover {
            border-color: #8b9cff;
            box-shadow: 0 0 25px rgba(139, 156, 255, 0.15);
            transform: translateY(-4px);
        }
    </style>
</head>
